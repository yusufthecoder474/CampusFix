name: CampusFix checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: campusfix
          POSTGRES_PASSWORD: ci-synthetic-password
          POSTGRES_DB: campusfix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusfix -d campusfix_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - name: Outbox adapter and worker checks
        run: node --test --experimental-test-coverage extension/tests/core.test.mjs
      - name: Native outbox transaction and concurrency checks
        run: node --test extension/tests/postgres.integration.mjs
        env:
          TEST_DATABASE_URL: postgresql://campusfix:ci-synthetic-password@127.0.0.1:5432/campusfix_test
      - run: npm test
      - run: npm run test:frontend
      - name: Native PostgreSQL integration suite
        run: node --import tsx scripts/test-native.ts
        env:
          TEST_DATABASE_URL: postgresql://campusfix:ci-synthetic-password@127.0.0.1:5432/campusfix_test
      - run: npm run build
      - run: npm run measure:bundle
      - run: npx playwright install --with-deps chromium
      - name: Native PostgreSQL browser suite
        run: node --import tsx scripts/e2e-native.ts
        env:
          TEST_DATABASE_URL: postgresql://campusfix:ci-synthetic-password@127.0.0.1:5432/campusfix_test
      - run: npm audit --omit=dev --audit-level=high

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campusfix-final-evidence
          path: docs/evidence/m5-*.json

