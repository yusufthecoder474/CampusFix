# Only the unique verification project uses this ephemeral database.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: campusfix_test
      POSTGRES_PASSWORD: ${CAMPUSFIX_TEST_PASSWORD:?Generated by verify-disposable.mjs}
      POSTGRES_DB: campusfix_verify_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql:size=256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusfix_test -d campusfix_verify_test"]
      interval: 2s
      timeout: 3s
      retries: 30
