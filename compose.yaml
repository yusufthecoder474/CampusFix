services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: campusfix
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD locally}
      POSTGRES_DB: campusfix
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - campusfix_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusfix -d campusfix"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  campusfix_data:
